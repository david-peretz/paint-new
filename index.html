<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <!-- Google tag (gtag.js) -->
    <!-- ONE loader serves every destination configured below. Do NOT add a second
         gtag.js loader script - one Google tag per page. To add another property,
         append a gtag('config', ...) line here instead. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-1060439344"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-1060439344');
      gtag('config', 'AW-951047760');
      gtag('config', 'G-QQCH0DE4P6');
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>צביעה מקצועית - שירותי צביעה איכותיים</title>
    <!-- Event snippet for phone click conversion -->
    <script>
      function gtag_report_conversion(url) {
        var navigated = false;
        // Must run even if gtag.js is blocked or fails to load, otherwise the
        // tel: navigation is lost: the click handlers call preventDefault().
        var callback = function () {
          if (navigated) return;
          navigated = true;
          if (typeof(url) != 'undefined') {
            window.location = url;
          }
        };
        // Same click, reported to both Ads accounts - each needs its own label.
        // Only one carries event_callback; the 1s timeout below is the real
        // safety net for the tel: navigation either way.
        gtag('event', 'conversion', {
          'send_to': 'AW-1060439344/lrJNCNDhfRCwitT5Aw',
          'value': 1.0,
          'currency': 'ILS'
        });
        gtag('event', 'conversion', {
          'send_to': 'AW-951047760/9csuCL2n87AaENCsv8UD',
          'value': 1.0,
          'currency': 'ILS',
          'event_callback': callback
        });
        setTimeout(callback, 1000);
        return false;
      }

      // Lead-form conversion. There is no thank-you page on this single-page site,
      // so Hero.tsx calls this after a successful submit instead. No navigation is
      // involved, so no event_callback and no timeout guard are needed - but it must
      // never throw, or it would break the form's success path when gtag is blocked.
      function gtag_report_lead() {
        try {
          gtag('event', 'conversion', {
            'send_to': 'AW-1060439344/qa-zCN-ZqVkQsIrU-QM'
          });
        } catch (e) {
          // gtag.js blocked or failed to load - the lead itself already went through.
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
