<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <!-- Google tag (gtag.js) -->
    <!-- ONE loader serves every destination configured below. Do NOT add a second
         gtag.js loader script - one Google tag per page. To add another property,
         append a gtag('config', ...) line here instead. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-1060439344"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-1060439344');
      gtag('config', 'AW-951047760');
      gtag('config', 'G-QQCH0DE4P6');
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />

    <!-- The fonts are render-blocking and come from two hosts; the handshake starts here
         instead of after the CSS has been parsed. crossorigin is required on the
         gstatic hint - the font files themselves are fetched anonymously. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- ===================== SEO =====================
         Everything below is deliberately STATIC. WhatsApp, Facebook, Twitter and
         LinkedIn scrape the raw HTML and never execute JavaScript, so a title or an
         og:image rendered by React would be invisible to every one of them. The
         schema.org graph is the one exception and lives in src/components/JsonLd.tsx,
         where it can be built from contact.ts / faqs.ts / pricing.ts instead of being
         retyped here and drifting out of sync.

         Since the build prerenders the page (scripts/prerender.mjs), that JSON-LD and
         every visible word now land in dist/index.html too - no renderer required.
         These tags still belong here rather than in React: index.html is where they
         are readable without running a build, and prerendering is not a reason to move
         them into a component.

         The domain is a placeholder until one exists. It appears in three places:
         this block, src/seo.ts (SITE_URL) and public/sitemap.xml. Change all three. -->
    <title>כמה עולה לצבוע דירה? מחירון צביעת דירות ובתים בגוש דן</title>

    />
    <link rel="canonical" href="https://www.example.co.il/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="צביעה מקצועית" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:url" content="https://www.example.co.il/" />
    <meta property="og:title" content="כמה עולה לצבוע דירה? מחירון צביעת דירות ובתים בגוש דן" />
    <meta

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="כמה עולה לצבוע דירה? מחירון צביעת דירות ובתים בגוש דן" />

    <!-- Event snippet for phone click conversion -->
    <script>
      function gtag_report_conversion(url) {
        var navigated = false;
        // Must run even if gtag.js is blocked or fails to load, otherwise the
        // tel: navigation is lost: the click handlers call preventDefault().
        var callback = function () {
          if (navigated) return;
          navigated = true;
          if (typeof(url) != 'undefined') {
            window.location = url;
          }
        };
        // Same click, reported to both Ads accounts - each needs its own label.
        // Only one carries event_callback; the 1s timeout below is the real
        // safety net for the tel: navigation either way.
        gtag('event', 'conversion', {
          'send_to': 'AW-1060439344/lrJNCNDhfRCwitT5Aw',
          'value': 1.0,
          'currency': 'ILS'
        });
        gtag('event', 'conversion', {
          'send_to': 'AW-951047760/9csuCL2n87AaENCsv8UD',
          'value': 1.0,
          'currency': 'ILS',
          'event_callback': callback
        });
        setTimeout(callback, 1000);
        return false;
      }

      // Lead-form conversion. There is no thank-you page on this single-page site,
      // so Hero.tsx calls this after a successful submit instead. No navigation is
      // involved, so no event_callback and no timeout guard are needed - but it must
      // never throw, or it would break the form's success path when gtag is blocked.
      function gtag_report_lead() {
        try {
          gtag('event', 'conversion', {
            'send_to': 'AW-1060439344/qa-zCN-ZqVkQsIrU-QM'
          });
        } catch (e) {
          // gtag.js blocked or failed to load - the lead itself already went through.
        }
      }
    </script>
